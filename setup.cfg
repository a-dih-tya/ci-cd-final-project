
[nosetests]
verbosity=2
with-coverage=1
cover-erase=1
cover-package=service
cover-html=1

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
fail_under = 80
skip_covered = False

[flake8]
max-line-length = 99
exclude = .git,__pycache__,venv,.venv
statistics = True
count = True

[pylint]
disable = C0114,C0115,C0116
max-line-length = 99
